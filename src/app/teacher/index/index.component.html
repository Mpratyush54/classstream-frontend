  <h1 class="center">Hello, {{name}}</h1>
  <div *ngIf="loadError" class="alert alert-warning m-3" role="alert">{{ loadError }}</div>
  <div class="dashboard-grid">
    <a class="dash-card" routerLink="/teacher/videos">
      <h3>Videos</h3>
      <p>Manage uploads & playback</p>
    </a>
    <a class="dash-card" routerLink="/teacher/notes">
      <h3>Notes</h3>
      <p *ngIf="notesCount">Total: {{ notesCount }}</p>
      <p *ngIf="!notesCount">View & manage notes</p>
    </a>
    <a class="dash-card" routerLink="/teacher/live">
      <h3>Live</h3>
      <p>Start a stream</p>
    </a>
    <a class="dash-card" routerLink="/teacher/notification">
      <h3>Notifications</h3>
      <p>Notify classes</p>
    </a>
  </div>
